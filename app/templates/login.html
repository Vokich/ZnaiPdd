{% extends "base-reg-log.html" %}
{% load static %}
{% block content %}
{% block extra_css %}{% endblock %}
<link rel="stylesheet" type="text/css" href="{% static '../static/css/login.css' %}">
<form method="POST" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label>Логин</label>
        {{ form.username }}
    </div>
    <div class="form-group">
        <label>Пароль</label>
        {{ form.password }}
    </div>
    {% if form.non_field_errors %}
        <div class="form-error">{{ form.non_field_errors }}</div>
    {% endif %}
    <button type="submit" class="btn-submit">Далее</button>
</form>
<div class="auth-register-link">
    Нет учётной записи? <a href="{% url 'reg' %}">Регистрация</a>
</div>
{% endblock %}
